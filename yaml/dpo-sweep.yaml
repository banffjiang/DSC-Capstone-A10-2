method: bayes
metric:
  name: train/loss-ema #dpo loss, might need to change to reward func
  goal: minimize

program: training.dpo_posttraining

command:
  - ${env}
  - python
  - "-m"
  - ${program}
  - --init_ckpt
  - /workspace/checkpoints/stage2/checkpoint-1000
  - --input_path
  - /workspace/repo/data/simple_wiki_passages.jsonl
  - --output_path
  - /workspace/checkpoints/dpo_training
  - --epochs
  - "1"
  - --batch_size
  - "8"
  - --grad_accum
  - "2"
  - --max_length
  - "256"
  - --nll_warmup_steps
  - "0"
  - --nll_steps_per_cycle
  - "1"
  - --dpo_steps_per_cycle
  - "2"
  - --nll_batch_size
  - "4"
  - --candidate_b_temp
  - "1.1"
  - --max_pair_similarity
  - "0.75"
  - --max_resample_tries
  - "2"
  - --max_new_tokens
  - "48"
  - --temperature
  - "0.7"
  - --top_p
  - "0.9"
  - --repetition_penalty
  - "1.1"
  - --no_repeat_ngram_size
  - "2"
  - --wandb_project
  - dpo-training
  - --data_limit
  - "5000"

parameters:
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-5

  beta:
    distribution: log_uniform_values
    min: 0.01
    max: 0.15

  score_gap_min:
    distribution: log_uniform_values
    min: 0.01
    max: 0.05

  alpha:
    distribution: log_uniform_values
    min: 0.05
    max: 0.3

  alpha_k:
    values: [5, 8]
  
