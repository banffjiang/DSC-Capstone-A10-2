apiVersion: batch/v1
kind: Job
metadata:
  name: dpo-debug-smoke
  namespace: dsc-capstone-25-26
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
                - NVIDIA-A40
                - NVIDIA-GeForce-RTX-3090

      initContainers:
      - name: init-permissions
        image: busybox
        command: ["sh", "-c", "mkdir -p /workspace/checkpoints && chmod -R 777 /workspace"]
        volumeMounts:
        - mountPath: /workspace
          name: storage-volume

      containers:
      - name: dpo-debug
        image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
        workingDir: /workspace
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            apt-get update && apt-get install -y git

            rm -rf /workspace/repo
            git clone https://github.com/banffjiang/DSC-Capstone-A10-2.git /workspace/repo
            cd /workspace/repo

            export PYTHONPATH=/workspace/repo
            pip install --no-cache-dir -r requirements.txt

            # --- DPO smoke test ---
            # Uses pretrained gpt2 (no init_ckpt), small dataset, and forces DPO every optimizer step.
            # Disables NLL mixing and KL to isolate "does DPO pipeline run and step?"
            python -m training.dpo_full_train_stage2 \
              --policy_model gpt2 \
              --reference_model gpt2 \
              --input_path data/simple_wiki_passages_8k.jsonl \
              --output_path /workspace/checkpoints/dpo_debug_kl \
              --epochs 1 \
              --batch_size 2 \
              --grad_accum 1 \
              --lr 5e-7 \
              --max_length 256 \
              --nll_warmup_steps 0 \
              --nll_steps_per_cycle 0 \
              --dpo_steps_per_cycle 1 \
              --score_gap_min 0.0 \
              --max_pair_similarity 0.99 \
              --max_resample_tries 0 \
              --max_new_tokens 16 \
              --temperature 0.7 \
              --top_p 0.9 \
              --repetition_penalty 1.1 \
              --kl_weight 0.00

            echo "DPO debug outputs:"
            ls -lah /workspace/checkpoints/dpo_debug_smoke || true

        env:
        - name: PYTHONPATH
          value: /workspace/repo
        - name: WANDB_MODE
          value: "disabled"
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        - name: HF_DATASETS_CACHE
          value: /workspace/.cache/huggingface/datasets
        - name: TRANSFORMERS_CACHE
          value: /workspace/.cache/huggingface/transformers
        - name: TORCH_SHOW_CPP_STACKTRACES
          value: "1"
        - name: PIP_CACHE_DIR
          value: /workspace/.cache/pip

        volumeMounts:
        - mountPath: /workspace
          name: storage-volume

        resources:
          requests:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "16"
            nvidia.com/gpu: "1"

      restartPolicy: Never

      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: nautilus.io/issue
        operator: Exists
        effect: NoSchedule

      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: colin-dpo-pvc